[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pyrpqd"
version = "0.1.0"
description = "Mechanism-resolved quantum and ring-polymer dynamics benchmarks"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scipy>=1.11"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
pyrpqd-benchmark = "pyrpqd.benchmark:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
